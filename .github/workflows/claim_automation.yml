name: Daily Claim Downloader via WebApp

on:
  schedule:
    # 한국시간 기준 매일 오전 8시 실행 (UTC 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 허용

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: Python 3.10 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 설치 (Selenium, Pandas 등)
      run: |
        python -m pip install --upgrade pip
        pip install selenium pandas openpyxl requests

    - name: Selenium 스크립트 실행
      env:
        COMPANY_CD: ${{ secrets.COMPANY_CD }}
        USER_ID: ${{ secrets.USER_ID }}
        USER_PW: ${{ secrets.USER_PW }}
      run: |
        python main.py
