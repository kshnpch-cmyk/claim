name: Claim Automation Pipeline

on:
  schedule:
    # 매시간 정각 실행 (Cron 표기법: 분 시 일 월 요일)
    - cron: '0 * * * *'
  # GitHub 화면에서 수동 실행(Run workflow) 기능 허용
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Repository 코드 체크아웃
      uses: actions/checkout@v4

    - name: Python 3.10 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: 클레임 수집 & 스크립트 실행
      env:
        ADMIN_ID: ${{ secrets.ADMIN_ID }}
        ADMIN_PW: ${{ secrets.ADMIN_PW }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        ALERT_RECEIVER: ${{ secrets.ALERT_RECEIVER }}
      run: |
        python main.py
