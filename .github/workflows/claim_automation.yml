name: Daily Claim Downloader via WebApp

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: Python 3.10 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필수 라이브러리 및 Chromium 설치
      run: |
        python -m pip install --upgrade pip
        pip install playwright pandas openpyxl requests
        playwright install --with-deps chromium

    - name: 자동화 스크립트 실행
      env:
        COMPANY_CD: ${{ secrets.COMPANY_CD }}
        USER_ID: ${{ secrets.USER_ID }}
        USER_PW: ${{ secrets.USER_PW }}
      run: |
        python main.py
