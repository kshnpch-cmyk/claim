name: Daily Claim Downloader

on:
  schedule:
    # 한국 시간(KST) 매일 오전 8시 실행 (UTC 기준 전날 23:00)
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: Python 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필수 패키지 및 Chromium 설치
      run: |
        python -m pip install --upgrade pip
        pip install playwright gspread google-auth pandas openpyxl
        playwright install --with-deps chromium

    - name: 자동화 스크립트 실행
      env:
        COMPANY_CD: ${{ secrets.COMPANY_CD }}
        USER_ID: ${{ secrets.USER_ID }}
        USER_PW: ${{ secrets.USER_PW }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
      run: |
        python main.py
